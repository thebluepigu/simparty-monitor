name: Neon 사용량 일일 브리프
# Worker(source=cf) run 만 제목 끝에 '· cf' — schedule-gate.sh·heartbeat 가 이 문자열로 정기 실행을 구분한다. 그 외 제목은 예전과 같다.
run-name: "Neon 사용량 일일 브리프${{ inputs.source == 'cf' && ' · cf' || '' }}"

# 목적: 매일 KST 09:17 Neon 프로젝트 'simparty' 의 현재 결제기간 소비량을 텔레그램으로 보고한다.
#       2026-09 장애(autosuspend 가 한 번도 안 일어나 Free 100 CU-h 를 16.7일에 소진 → prod 6일 다운)의
#       조기 경보가 목적.
#
# 조회는 Neon control plane API(console.neon.tech/api/v2) 만 쓴다 — DB 에 접속하지 않으므로 compute 를
#   깨우지 않는다(consumption API 는 문서에 "does not wake computes" 명시). 누적값 갱신이 ~15분 주기라
#   하루 1회면 충분하다.
#
# 시각: UTC 00:17 (KST 09:17). 정각(00:00)은 GitHub 스케줄 지연·드롭이 잦고 Neon 결제기간 경계(월초 00:00Z)와
#   겹쳐 몇 분치 사용량을 외삽하는 오경보가 난다 → 17분으로 비킨다(기간 시작 1일 미만은 외삽 자체도 생략).
#
# 브리프(문단 5개, 본문은 .github/scripts/telegram-format.sh 의 fmt_brief — 문구 조정은 그 파일만):
#   ① 판정 한 줄 ② 사이트(열린 장애 이슈·마지막 확인 시각) ③ Neon 사용·비용 ④ autosuspend ⑤ 감시 자체(heartbeat·
#   최근 24h 실행 수 vs 설계 144·저장소 마지막 커밋).
# 신호등(첫 줄 = 섹션 중 가장 나쁜 색 — 판정은 neon-usage.sh 의 .level 한 곳):
#   🔴 autosuspend 미작동 의심 — 아래 둘 중 하나라도 ≥ 90%
#      (a) 최근 24시간 중 "내내 켜져 있던" 시간 비율 (v2 hourly compute_unit_seconds ≥ 0.9×최소CU×3600, 프로젝트 합계)
#      (b) 직전 실행 대비 기본 브랜치 active_time_seconds 증가분 / 경과시간 (직전값은 actions/cache,
#          첫 실행·간격 20시간 미만(수동 실행 등)은 생략하고 기준점도 유지. 기본 브랜치 값이 없으면 프로젝트 합계로
#          대체하고 문구에 명시)
#   🔴 열린 업타임 장애 이슈가 있음(사이트 장애 중)
#   🟡 기간 말 예상 비용이 vars.NEON_BUDGET_USD (기본 $15) 초과 또는 그 NEON_BUDGET_WARN_PCT(기본 80)% 이상, 또는 uptime.yml 마지막 **정기(schedule·Worker cf)** 성공 실행이 6시간 넘게
#      전이거나 확인 불가, 또는 DB 경유(full) 체크 마지막 성공이 36시간 넘게 전 (감시 워크플로 자체가 멈추거나 full 이 영영
#      강등되는 것을 드러내는 heartbeat). 2026-10-13: 2h/14h 는 GitHub 무료 cron 드롭(실측 간격 최대 ~3시간, full 하루 2회)
#      때문에 매일 경보(옛 ⚠️)라 희석 → 12h/36h 로 완화했다가, 12h 는 밤 22시에 멈춘 감시를 09:17 에 정상(옛 ✅)으로 보여 6h 로 조정.
#      수동 test-alert 성공은 heartbeat 로 세지 않는다(체크 없이 성공 — 멈춘 스케줄을 가림). 드롭 정도는 ⑤ 의 "최근 24h
#      실행 N회 / 설계 144" 로 따로 보여 준다(RUNS_WARN_PCT 기본 0 = 경보 아님). 기준은 vars.HB_UPTIME_MAX_H · vars.HB_FULL_MAX_H 로 조정.
#      ② 사이트 "🟢 정상" 은 열린 장애 이슈가 없고 uptime 마지막 성공이 vars.SITE_FRESH_H(3h) 이내일 때만. 사이트 🟡 기준은
#      SCHEDULER=cloudflare 면 3h, github 면 6h(3~6h 는 🟢 + 'GitHub 지연' 글자 — 매일 🟡 소음 방지).
#      또는 SCHEDULER=cloudflare 인데 최근 60분 Worker run 없음(예약 실행기 멈춤) · SCHEDULER 값 오류.
#      또는 저장소 마지막 커밋이 45일(REPO_IDLE_WARN_DAYS) 이상 전 — 공개 repo 는 60일 무활동이면 GitHub 가 schedule 을
#      자동 비활성화한다. 자동 빈 커밋(keepalive)은 GitHub 가 약관 위반으로 막은 전례가 있어 쓰지 않고, 사람이 사소한
#      커밋 1건을 하도록 여기서 알린다(README '60일 규칙' 참고).
#   시간별 데이터가 비면 "0/24 정상" 으로 읽지 않고 "데이터 없음 — 판정 불가" 로 표시.
# CU-h: consumption_history v2 compute_unit_seconds(요금 기준, Launch 이상·org_id 필요) 우선,
#       불가하면 compute_time_seconds/3600 근사치("(근사치)" 표기).
# 조정 가능한 repo variables(없으면 기본값): NEON_PROJECT_ID, NEON_CU_HOUR_USD(0.106),
#   NEON_STORAGE_GB_USD(0.35), NEON_BUDGET_USD(15), NEON_MIN_CU(0.25), REPO_IDLE_WARN_DAYS(45),
#   NEON_BUDGET_WARN_PCT(80, 0 = 끔), RUNS_WARN_PCT(0 = 끔 — Cloudflare 전환 뒤 켠다), HB_UPTIME_MAX_H(6), SITE_FRESH_H(3), HB_FULL_MAX_H(36).
# 주의: schedule 은 기본 브랜치(main)에 있는 파일만 실행된다.

# 수동 preview: gh workflow run neon-usage.yml -f mode=preview — 실데이터로 브리프를 렌더해 첫 줄에 "[미리보기] " 를 붙여 보내고,
#   상태(autosuspend 판정 기준점) 저장·캐시 저장을 하지 않는다 → 다음 날 정기 판정에 영향 없음. 서식 조정 확인용.

on:
  schedule:
    - cron: '17 0 * * *'   # UTC 00:17 = KST 09:17
  workflow_dispatch:
    inputs:
      mode:
        description: "preview([미리보기] 태그, 상태 저장 안 함 — 서식 확인용) | normal(정기와 동일, 판정 기준점 갱신)"
        required: true
        default: preview
        type: choice
        options: [preview, normal]
      source:
        description: "manual(사람 — 기본) | cf(Cloudflare 예약 실행기 전용 — 정기 브리프로 취급, 손으로 고르지 말 것)"
        required: false
        default: manual
        type: choice
        options: [manual, cf]

# 예약 실행 경로 (2026-10-30, scheduler/README.md): Cloudflare Worker 가 UTC 00:17 정시에 mode=normal·source=cf 로 보낸다.
#   on.schedule 은 대비책으로 남긴다. repo 변수 SCHEDULER(없으면 github):
#     github(기본·지금) : schedule run 은 오늘과 똑같이 돈다
#     cloudflare        : schedule run 은 오늘(KST) 정기 브리프(schedule·cf)를 이미 보냈으면 건너뛰고, 아니면 대신 보낸다
#   Worker run 은 SCHEDULER 와 무관하게 오늘 정기 브리프가 이미 갔으면 건너뛴다(concurrency 그룹이 직렬화 → 하루 1통).
#   "이미 갔음" = '브리프 전송 표식' 스텝 success(텔레그램 전송 성공 — 템플릿 고장으로 plain 폴백을 보내고 job 이 실패해도 보냄)
#   또는 브리프 스텝 success. 전송 자체가 실패한 run 은 보낸 것이 아니라서 대비책이 다시 보낸다.
#   사람의 수동 실행(preview·normal, source=manual)은 언제나 돌고 정기 실행으로 세지 않는다.
#   ⚠️ 되돌릴 때 순서: Worker 크론 삭제(또는 DRY_RUN=1) → 15분 대기 → SCHEDULER 삭제. SCHEDULER 부터 지우면 그날 schedule
#   브리프가 조회 없이 돌아 Worker 브리프(09:17)와 합쳐 2통이 된다(SCHEDULER 없음 = gh 조회 0회 = 지금과 똑같음을 지키려는 것).

permissions:
  contents: read
  actions: read     # uptime.yml 실행 조회(heartbeat·최근 24h 실행 수)
  issues: read      # 열린 업타임 장애 이슈 조회(브리프 ② 사이트) — 읽기만

concurrency:
  group: neon-usage
  cancel-in-progress: false

jobs:
  neon-usage:
    runs-on: ubuntu-latest
    # Neon 호출 최대 ~6회 × (30s + 5s + 30s) 최악 → 5분은 빠듯
    timeout-minutes: 8
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATE_DIR: .monitor-state
      # 예약 실행 주 경로: github(기본) | cloudflare — 스크립트(neon-usage.sh 등)는 읽기만 한다
      SCHEDULER: ${{ vars.SCHEDULER || 'github' }}
      # full(DB 경유) 주기(시간, uptime-mode.sh 가 강제) — hb 가 'DB 포함 점검 예정 N번' 을 계산. 없으면 1(매시 = 13회, 지금과 같음)
      FULL_EVERY_HOURS: ${{ vars.FULL_EVERY_HOURS || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          persist-credentials: false

      # 하루 1통 보장(run=0 → 아래 스텝 skipped, run 은 success). 조회 실패는 진행(fail-open). 출력이 비면 기존처럼 진행.
      - name: 정기 브리프 중복 확인 (Cloudflare 대비책)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/schedule-gate.sh brief

      - name: 직전 상태 복원
        if: steps.gate.outputs.run != '0'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: neon-usage-state-${{ github.run_id }}
          restore-keys: neon-usage-state-

      # ⚠️ 이 스텝 id(hb)·이름은 tests/schedule-gate.test.sh 가 추출해 가짜 gh 로 돌린다.
      - name: uptime 감시 heartbeat 조회
        id: hb
        if: steps.gate.outputs.run != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 실패해도 브리프는 보낸다 — 값이 비면 브리프에 "확인 불가" 로 표시
          # "정기 실행" = schedule 이벤트 + Cloudflare Worker 의 dispatch(source=cf → run-name 'uptime · cf · …').
          #   사람의 수동 실행(test-alert·quick·full)은 세지 않는다 — test-alert 는 체크 없이 성공해 멈춘 스케줄을 가린다(F4)
          # SCHEDULER=cloudflare 면 schedule run 은 대비책이라 대부분 '정기 실행 중복 확인' 에서 건너뛰고(체크 없이) success 로
          #   끝난다 → schedule run 은 체크 스텝 결론을 run 별로 확인해 실제로 체크한 것만 센다(조회 최대 VERIFY_MAX 건).
          #   SCHEDULER=github(기본)면 건너뛴 run 이 없으므로 예전처럼 run 목록만으로 센다(추가 조회 없음).
          CHECK_STEP='업타임 체크 + 장애 이슈/텔레그램'
          VERIFY_MAX=40; VERIFIED=0
          declare -A CC=()
          check_concl() {  # $1 run id → CONCL = 체크 스텝 결론(success|failure|skipped|…, 조회 실패·한도 초과 = 빈 값)
            CONCL=""       # $( ) 서브셸로 부르면 캐시·조회 횟수가 사라지므로 전역 변수로 돌려준다
            if [ -z "${CC[$1]+x}" ]; then
              if [ "$VERIFIED" -ge "$VERIFY_MAX" ]; then return 0; fi
              VERIFIED=$((VERIFIED + 1))
              CC[$1]="$(gh run view "$1" --json jobs 2>/dev/null < /dev/null \
                | jq -r --arg s "$CHECK_STEP" '[.jobs[]?.steps[]? | select(.name == $s) | .conclusion // ""] | .[0] // ""' 2>/dev/null || true)"
            fi
            CONCL="${CC[$1]}"
          }
          # SCHEDULER 해석은 schedule-gate.sh 와 같다(대소문자·공백 무시, 모르는 값 = github + 경고)
          sched_mode="$(printf '%s' "${SCHEDULER:-github}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"; sched_bad=0
          case "$sched_mode" in
            ''|github) sched_mode=github ;; cloudflare) ;;
            *) echo "::warning::repo 변수 SCHEDULER='${SCHEDULER}' 를 알 수 없음 — github 으로 취급"; sched_mode=github; sched_bad=1 ;;
          esac
          # 최근 실행 목록 1회 조회(300건 ≈ 설계상 2일치) — 24h 실행 수·full 후보를 여기서 같이 뽑는다
          runs="$(gh run list --workflow uptime.yml --limit 300 --json databaseId,displayTitle,createdAt,event,conclusion 2>/dev/null || true)"
          since="$(date -u -d '-24 hours' +%s)"
          # 정기 실행 후보(최신순) TSV: id  event(schedule|cf)  createdAt  run결론  full의도(1|0)  24h안(1|0)
          #   취소·기동 실패로 끝난 Worker run 은 체크를 안 했으므로 뺀다(진행 중 run 은 결론이 비어 포함)
          regular="$(jq -r --argjson s "$since" '.[]
              | select(.event == "schedule" or ((.conclusion // "") | IN("cancelled", "startup_failure", "skipped") | not))
              | select(.event == "schedule" or (.event == "workflow_dispatch" and ((.displayTitle // "") | contains("· cf ·"))))
              | [.databaseId, (if .event == "schedule" then "schedule" else "cf" end), .createdAt, (.conclusion // ""),
                 (if ((.displayTitle // "") | endswith("· full")) then 1 else 0 end),
                 (if (.createdAt | fromdateiso8601) >= $s then 1 else 0 end)] | @tsv' <<< "$runs" 2>/dev/null | tr -d '\r' || true)"
          last=""; runs24=0; full24=0; cf24=0; fb24=0; cf_last=""
          while IFS=$'\t' read -r id ev created concl isfull in24; do
            [ -n "$id" ] || continue
            ran=1; ok=0
            if [ "$ev" = "cf" ]; then
              [ -n "$cf_last" ] || cf_last="$created"
              if [ "$concl" = "success" ]; then ok=1; fi
            elif [ "$sched_mode" = "cloudflare" ]; then
              # 건너뛴 대비책 run 은 체크 스텝이 skipped — 실제 체크(success|failure)만 실행으로 센다
              if [ "$in24" = "1" ] || [ -z "$last" ]; then
                check_concl "$id"
                case "$CONCL" in success) ok=1 ;; failure) ;; *) ran=0 ;; esac
              else ran=0; fi
            else
              if [ "$concl" = "success" ]; then ok=1; fi
            fi
            if [ "$ok" = "1" ] && [ -z "$last" ]; then last="$created"; fi
            if [ "$in24" = "1" ] && [ "$ran" = "1" ]; then
              runs24=$((runs24 + 1)); if [ "$isfull" = "1" ]; then full24=$((full24 + 1)); fi
              if [ "$ev" = "cf" ]; then cf24=$((cf24 + 1)); else fb24=$((fb24 + 1)); fi
            fi
          done <<< "$regular"
          if [ "$sched_mode" != "cloudflare" ]; then
            # github(기본): 예전과 같은 heartbeat 조회(300건 밖의 오래된 성공도 찾는다) — Worker run 이 더 최근이면 그쪽
            ls="$(gh run list --workflow uptime.yml --status success --event schedule --limit 1 --json createdAt -q '.[0].createdAt // ""' 2>/dev/null || true)"
            if [ -n "$ls" ] && { [ -z "$last" ] || [[ "$ls" > "$last" ]]; }; then last="$ls"; fi
          fi
          if [ "$VERIFIED" -ge "$VERIFY_MAX" ]; then
            echo "::notice::schedule run 체크 스텝 조회 상한 ${VERIFY_MAX}건 도달 — 그 밖의 오래된 schedule run 은 집계에서 뺌(표시값만 영향)"
          fi
          # 예약 실행기(Worker) 멈춤 판정 — cloudflare 모드에서 최근 CF_STALE_MAX_MIN(60분) 안에 Worker run 이 없으면 1.
          #   Worker 는 10분마다 보내므로 60분 = 6번 연속 빠짐. 토큰 만료·DRY_RUN 그대로·크론 삭제 등. github 모드·조회 실패면 빈 값.
          cf_stale=""
          if [ "$sched_mode" = "cloudflare" ] && [ -n "$runs" ]; then
            cmax="${CF_STALE_MAX_MIN:-60}"; case "$cmax" in ''|*[!0-9]*) cmax=60 ;; esac
            cf_stale=1
            if [ -n "$cf_last" ] && [ $(( $(date -u +%s) - $(date -u -d "$cf_last" +%s 2>/dev/null || echo 0) )) -lt $((cmax * 60)) ]; then cf_stale=0; fi
            [ "$cf_stale" = "0" ] || echo "::warning::SCHEDULER=cloudflare 인데 최근 ${cmax}분 안에 Worker run 없음(마지막 ${cf_last:-없음}) — GitHub schedule 대비책으로 동작 중"
          fi
          if [ -z "$runs" ]; then runs24=""; full24=""; cf24=""; fb24=""; cf_last=""; fi
          echo "uptime.yml 마지막 정기 성공: ${last:-없음} (scheduler=${sched_mode}, 체크 스텝 조회 ${VERIFIED}건, Worker 마지막 ${cf_last:-없음}, 멈춤=${cf_stale:-해당 없음})"
          { echo "last=${last}"; echo "cf24=${cf24}"; echo "fb24=${fb24}"; echo "cf_last=${cf_last}"; echo "cf_stale=${cf_stale}"
            echo "scheduler=${sched_mode}"; echo "scheduler_bad=${sched_bad}"; } >> "$GITHUB_OUTPUT"
          # 설계상 하루 DB체크(full) 횟수: repo 변수 FULL_EVERY_HOURS(uptime-mode.sh 와 같은 해석 — 정수 아니면 1)로 계산.
          #   1→13 · 2→7 · 3→5 · 0→0 (KST 11~23시 중 (UTC시−2) % N == 0 인 시간 수)
          fe="$(printf '%s' "${FULL_EVERY_HOURS:-}" | tr -d '[:space:]')"
          if [[ "$fe" =~ ^[0-9]+$ ]]; then fe=$((10#$fe)); else fe=1; fi
          dfull=0
          if [ "$fe" -gt 0 ]; then for h in $(seq 2 14); do if [ $(((h - 2) % fe)) -eq 0 ]; then dfull=$((dfull + 1)); fi; done; fi
          echo "design_full=${dfull}" >> "$GITHUB_OUTPUT"
          # DB 경유(full) 체크 heartbeat: full '의도' run(displayTitle '· full' — 강등돼도 이 제목) 중 'DB 경유(full) 실행 표식'
          # 스텝과 체크 스텝이 둘 다 success 인 run = 실제로 DB 체크를 한 run (스텝 이름은 uptime.yml 과 동기).
          #   full    = 그런 run 중 가장 최근의 체크 완료 시각
          #   fullx24 = 최근 24h 안의 그런 run 수 (설계 13)
          # 최신순 최대 20건만 본다(run 1건 = API 1회). 24h 밖으로 나갔고 full 을 찾았으면 멈춤.
          full=""; fullx24=0
          while read -r id created; do
            [ -n "$id" ] || continue
            t="$(gh run view "$id" --json jobs -q '[.jobs[]?.steps[]?] as $s
                  | if any($s[]; .name == "DB 경유(full) 실행 표식" and .conclusion == "success")
                    then ([$s[] | select(.name == "업타임 체크 + 장애 이슈/텔레그램" and .conclusion == "success") | .completedAt] | .[0] // "")
                    else "" end' 2>/dev/null < /dev/null || true)"
            in24=0
            if [ "$(date -u -d "$created" +%s 2>/dev/null || echo 0)" -ge "$since" ]; then in24=1; fi
            if [ -n "$t" ] && [ "$t" != "null" ]; then
              [ -n "$full" ] || full="$t"
              if [ "$in24" = "1" ]; then fullx24=$((fullx24 + 1)); fi
            fi
            if [ "$in24" = "0" ] && [ -n "$full" ]; then break; fi
          done < <(jq -r '.[] | select((.displayTitle // "") | endswith("· full")) | "\(.databaseId) \(.createdAt)"' <<< "$runs" 2>/dev/null | head -n 20 || true)
          [ -n "$runs" ] || fullx24=""
          echo "uptime.yml DB체크(full) 마지막 성공: ${full:-없음} · 최근 24h 정기 ${runs24:-?}회 / full 의도 ${full24:-?}회 / DB체크 실제 ${fullx24:-?}회"
          { echo "full=${full}"; echo "runs24=${runs24}"; echo "full24=${full24}"; echo "fullx24=${fullx24}"; } >> "$GITHUB_OUTPUT"
          # 열린 업타임 장애 이슈 (uptime.sh 와 같은 판별: 봇 작성자 AND 라벨 AND 제목 키 AND PR 아님). 실패 = 빈 값 → "확인 불가"
          inc="$(gh api "repos/${GH_REPO}/issues?state=open&labels=uptime-incident&per_page=100&sort=created&direction=asc" 2>/dev/null \
            | jq -c '[.[] | select((.pull_request == null)
                  and ((.user.login // "") == "github-actions[bot]") and ((.user.type // "") == "Bot")
                  and (((.labels // []) | map(.name? // .) | index("uptime-incident")) != null)
                  and ((.title // "") | contains("[uptime] 장애 감지")))]
                | if length == 0 then {open: false}
                  else .[0] | (.body // "") as $b | .created_at as $c
                    | {open: true, number, url: .html_url,
                       failed: ([$b | capture("<!-- failed: (?<v>[^ ]+) -->") | .v] | last // ""),
                       since: ([$b | capture("<!-- down-since: (?<v>[^ ]+) -->") | .v] | last // $c)} end' 2>/dev/null || true)"
          echo "열린 장애 이슈: ${inc:-확인 불가}"
          echo "incident=${inc}" >> "$GITHUB_OUTPUT"
          # 저장소 마지막 커밋 시각(epoch) — 공개 repo 60일 무활동 스케줄 자동 비활성 조기 경보용.
          # checkout(fetch-depth 기본 1 = 얕은 체크아웃)도 HEAD 커밋 객체는 있으므로 git log -1 로 충분하다.
          # 스케줄 run 의 HEAD = 기본 브랜치 최신 커밋. 실패하면 REST(커밋 목록 1건)로 대체, 둘 다 실패하면 빈 값 → 브리프 ⚠️
          lc="$(git log -1 --format=%ct 2>/dev/null || true)"
          if [ -z "$lc" ]; then
            iso="$(gh api "repos/${GH_REPO}/commits?per_page=1" --jq '.[0].commit.committer.date // ""' 2>/dev/null || true)"
            [ -z "$iso" ] || lc="$(date -u -d "$iso" +%s 2>/dev/null || true)"
          fi
          case "$lc" in ''|*[!0-9]*) lc="" ;; esac
          echo "저장소 마지막 커밋(epoch): ${lc:-확인 불가}"
          echo "last_commit=${lc}" >> "$GITHUB_OUTPUT"

      # ⚠️ 이 스텝 이름은 schedule-gate.sh(BRIEF_STEP)가 "오늘 정기 브리프를 이미 보냈는지" 문자열로 조회한다 — 바꾸지 말 것.
      # 출력 sent=1 = 텔레그램 전송 성공(neon-usage.sh 가 남김) → 아래 '브리프 전송 표식' 스텝이 success 가 된다.
      - name: Neon 사용량 조회 + 텔레그램 브리프
        id: brief
        if: steps.gate.outputs.run != '0'
        env:
          NEON_API_KEY: ${{ secrets.SIMPARTY_NEON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SIMPARTY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SIMPARTY_TELEGRAM_CHAT_ID }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_CU_HOUR_USD: ${{ vars.NEON_CU_HOUR_USD || '0.106' }}
          NEON_STORAGE_GB_USD: ${{ vars.NEON_STORAGE_GB_USD || '0.35' }}
          NEON_BUDGET_USD: ${{ vars.NEON_BUDGET_USD || '15' }}
          # 기간 말 예상 비용이 예산의 이 % 이상이면 🟡 (0 = 끔)
          NEON_BUDGET_WARN_PCT: ${{ vars.NEON_BUDGET_WARN_PCT || '80' }}
          NEON_MIN_CU: ${{ vars.NEON_MIN_CU || '0.25' }}
          UPTIME_LAST_SUCCESS: ${{ steps.hb.outputs.last }}
          UPTIME_LAST_FULL: ${{ steps.hb.outputs.full }}
          REPO_LAST_COMMIT_EPOCH: ${{ steps.hb.outputs.last_commit }}
          REPO_IDLE_WARN_DAYS: ${{ vars.REPO_IDLE_WARN_DAYS || '45' }}
          UPTIME_RUNS_24H: ${{ steps.hb.outputs.runs24 }}
          UPTIME_FULL_24H: ${{ steps.hb.outputs.full24 }}
          UPTIME_FULL_EXEC_24H: ${{ steps.hb.outputs.fullx24 }}
          UPTIME_INCIDENT: ${{ steps.hb.outputs.incident }}
          # 설계상 하루 DB 포함 점검 횟수(repo 변수 FULL_EVERY_HOURS 에서 계산, 없으면 13 — 예전 기본값과 같음)
          UPTIME_DESIGN_FULL: ${{ steps.hb.outputs.design_full || '13' }}
          # 최근 24h 정기 실행 중 Worker(cf)·GitHub schedule(대비책) 각각의 수 — 템플릿이 쓰면 표시(참고값)
          UPTIME_CF_RUNS_24H: ${{ steps.hb.outputs.cf24 }}
          UPTIME_FALLBACK_RUNS_24H: ${{ steps.hb.outputs.fb24 }}
          # 예약 실행기 상태 — cloudflare 모드에서 최근 60분 Worker run 없음 = UPTIME_CF_STALE 1(🟡 대상), 0 = 정상, 빈 값 = github 모드·확인 불가
          #   UPTIME_CF_LAST = 마지막 Worker run 시각(ISO) · SCHEDULER_BAD 1 = SCHEDULER 값 오타(github 으로 취급 중)
          UPTIME_CF_LAST: ${{ steps.hb.outputs.cf_last }}
          UPTIME_CF_STALE: ${{ steps.hb.outputs.cf_stale }}
          SCHEDULER_BAD: ${{ steps.hb.outputs.scheduler_bad }}
          HB_UPTIME_MAX_H: ${{ vars.HB_UPTIME_MAX_H || '6' }}
          SITE_FRESH_H: ${{ vars.SITE_FRESH_H || '3' }}
          HB_FULL_MAX_H: ${{ vars.HB_FULL_MAX_H || '36' }}
          # 24h 점검 횟수가 예정의 이 % 미만이면 🟡 — 기본 0(끔). GitHub cron 은 매일 미달이라 Cloudflare 전환 뒤 켠다(예: 80)
          RUNS_WARN_PCT: ${{ vars.RUNS_WARN_PCT || '0' }}
          # 정기(schedule) 실행엔 inputs 가 없어 normal
          BRIEF_MODE: ${{ inputs.mode || 'normal' }}
        run: bash .github/scripts/neon-usage.sh

      # 하루 1통 판정용 표식 — 브리프가 실제로 텔레그램에 갔으면 success(템플릿 고장으로 job 이 실패로 끝나도). 전송 실패면 skipped →
      # 대비책이 다시 보낸다. ⚠️ 이 이름은 schedule-gate.sh(SENT_STEP)가 문자열로 조회한다 — 바꾸지 말 것.
      - name: 브리프 전송 표식
        if: always() && steps.brief.outputs.sent == '1'
        run: echo "sent=1 — 오늘 정기 브리프를 텔레그램으로 보냄 (schedule-gate.sh 가 하루 1통 판정에 사용)"

      # preview 는 판정 기준점을 덮지 않는다 (스크립트도 상태 파일을 쓰지 않지만, 복원된 파일을 새 키로 다시 저장하는 것도 막음)
      - name: 상태 저장
        if: always() && inputs.mode != 'preview' && steps.gate.outputs.run != '0' && hashFiles('.monitor-state/neon-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: neon-usage-state-${{ github.run_id }}-${{ github.run_attempt }}

      # ---- 감시 자체 실패: 텔레그램 6시간에 1건 ----
      - name: 감시 실패 알림 — 직전 전송 시각 복원
        if: failure() || cancelled()
        uses: actions/cache/restore@v4
        with:
          path: .selffail
          key: neon-selffail-${{ github.run_id }}
          restore-keys: neon-selffail-

      - name: 감시 자체 실패 알림
        id: selffail
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SIMPARTY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SIMPARTY_TELEGRAM_CHAT_ID }}
          BRIEF_MODE: ${{ inputs.mode || 'normal' }}
        run: |
          now="$(date -u +%s)"
          last="$(cat .selffail/last 2>/dev/null || echo 0)"
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          if [ $((now - last)) -lt 21600 ]; then
            echo "::warning::직전 감시 실패 알림 후 6시간 미만 — 텔레그램 생략 (GitHub 실패 메일은 발송됨)"; exit 0
          fi
          reason="$(tail -n 5 "$RUNNER_TEMP/monitor_fail_reason" 2>/dev/null || true)"
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::텔레그램 시크릿 없음 — GitHub 실패 메일만 발송됨"; exit 0
          fi
          sent=0
          # 1차: 템플릿 lib(fmt_selffail, HTML)를 **서브셸**에서 — lib·템플릿이 깨져 source·렌더가 죽어도 이 스텝은 산다
          #      (템플릿이 깨졌으면 lib 가 스스로 plain 형식으로 대체). 2차: 1차가 어떤 이유로든 실패하면 항상 인라인 plain.
          if ( set +e
               source .github/scripts/monitor-lib.sh || exit 1
               tg_render fmt_selffail workflow=neon-usage mode="${BRIEF_MODE}" reason="$reason" run="$RUN_URL" suppress_h=6
               [ -n "$TG_MSG" ] && tg_send "$TG_MSG" "$TG_MSG_PM" ); then
            sent=1
          else
            echo "::warning::템플릿 경로 실패 — 인라인 plain 으로 전송"
            # lib 없이 인라인 plain. 토큰은 stdin 설정으로만 전달
            text="🟡 감시 자체 실패: neon-usage (${BRIEF_MODE}) — 이후 6시간 같은 알림 억제
          ${reason}
          ${RUN_URL}"
            http="$(printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$TELEGRAM_BOT_TOKEN" \
              | curl -sS -K - -X POST --max-time 20 -o /dev/null -w '%{http_code}' \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text:0:4000}")" || http="000"
            echo "telegram HTTP ${http}"
            [ "$http" != "200" ] || sent=1
          fi
          if [ "$sent" != "1" ]; then
            echo "::warning::감시 실패 알림 전송도 실패"
          elif [ "$BRIEF_MODE" = "preview" ]; then
            # 수동 preview(서식 조정 중) 실패는 6시간 억제 상태를 남기지 않는다 — 다음 정기 브리프의 실패 알림을 가리지 않게
            echo "preview 실패 — 알림은 보냈지만 6시간 억제 상태는 저장하지 않음"
          else
            mkdir -p .selffail && echo "$now" > .selffail/last && echo "saved=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 감시 실패 알림 — 전송 시각 저장
        if: (failure() || cancelled()) && steps.selffail.outputs.saved == '1'
        uses: actions/cache/save@v4
        with:
          path: .selffail
          key: neon-selffail-${{ github.run_id }}-${{ github.run_attempt }}
